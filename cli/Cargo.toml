[package]
name = "crust_cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for the Crust project"
license = "MIT OR Apache-2.0"

[dependencies]
toml_edit.workspace = true
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
crust_scaffolding_application = { path = "../crates/scaffolding/application", version = "0.1.0" }
crust_scaffolding_domain = { path = "../crates/scaffolding/domain", version = "0.1.0" }
crust_workspace_application = { path = "../crates/workspace/application", version = "0.1.0" }
